spring.application.name=TarefasAutenticacao

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# jwt.secret: a chave usada para assinar o token no login e para conferir a assinatura nas próximas requisições.
jwt.secret=${JWT_SECRET}
# por quanto tempo o token vale (1 hora). Depois disso, ele é recusado e o usuário precisa logar de novo.
jwt.expiracao=3600000
